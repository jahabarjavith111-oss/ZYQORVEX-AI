name: ZYQORVEX-AI DevSecOps & FinOps Guardrails

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  audit:
    name: Security & Cost Audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FinOps & Cost Audit
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 cost_auditor.py

      - name: Run Kernel Patch Analysis
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 patch_analyzer.py

      - name: Run K8s Security Hardener
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 k8s_policy_generator.py

      - name: Run Terraform IaC Auditor
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 terraform_auditor.py

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results-${{ github.run_id }}
          path: |
            analysis_results.json
            infrastructure_audit_report.json
            terraform_audit_results.json
            cost_drift_report.json
            hardened_deployment.yaml
            enforcement_policy_summary.txt
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## ZYQORVEX-AI Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | Status | Output |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          [ -f analysis_results.json ] && echo "| Kernel Patch Review | ✅ | \`analysis_results.json\` |" >> $GITHUB_STEP_SUMMARY || echo "| Kernel Patch Review | ⏭️ skipped | — |" >> $GITHUB_STEP_SUMMARY
          [ -f terraform_audit_results.json ] && echo "| Terraform IaC Audit | ✅ | \`terraform_audit_results.json\` |" >> $GITHUB_STEP_SUMMARY || echo "| Terraform IaC Audit | ⏭️ skipped | — |" >> $GITHUB_STEP_SUMMARY
          [ -f cost_drift_report.json ] && echo "| FinOps Cost Drift | ✅ | \`cost_drift_report.json\` |" >> $GITHUB_STEP_SUMMARY || echo "| FinOps Cost Drift | ⏭️ skipped | — |" >> $GITHUB_STEP_SUMMARY
          [ -f hardened_deployment.yaml ] && echo "| K8s Policy Hardener | ✅ | \`hardened_deployment.yaml\` |" >> $GITHUB_STEP_SUMMARY || echo "| K8s Policy Hardener | ⏭️ skipped | — |" >> $GITHUB_STEP_SUMMARY

  # Optional: SARIF upload for code scanning (if you generate SARIF)
